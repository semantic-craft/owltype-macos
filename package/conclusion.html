<!DOCTYPE html>
<html lang="zh-Hans">
<head><meta charset="UTF-8"/></head>
<body>
	<p><b>安装完成。请按接下来的系统提示注销并重新登录一次</b>（仅首次安装需要；日后更新经 Sparkle 自动安装，无需注销）。</p>
	<p>系统若弹出「是否允许添加输入法"猫头鹰 Owltype"」，请点击<b>允许</b>。</p>
	<p>然后从屏幕右上角的输入法菜单选择<b>猫头鹰 Owltype</b>（或按 <b>⌃ Control–空格</b>切换）。</p>
	<p>若<b>选中猫头鹰后打不出字</b>：请<b>退出并重新打开</b>你正在打字的 App（⌘Q 后重开）——安装/更新前就开着的 App 需重启才能接上新版猫头鹰；或<b>注销重新登录一次</b>。</p>
	<p>若<b>菜单里根本没有猫头鹰</b>：<b>注销重新登录一次</b>通常即会出现；仍没有再打开<b>系统设置 ▸ 键盘 ▸ 文本输入 ▸ 编辑…</b>手动添加一次。</p>
</body>
</html>
