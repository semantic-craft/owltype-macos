<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head><meta charset="UTF-8"/></head>
<body>
	<p><b>安裝完成。請按接下來的系統提示登出並重新登入一次</b>（僅首次安裝需要；日後更新經 Sparkle 自動安裝，不需登出）。</p>
	<p>系統若跳出是否允許新增<b>法墨 Famo</b>的提示，請點選<b>允許</b>。</p>
	<ol>
		<li>從螢幕右上角輸入選單選擇<b>法墨 Famo</b>（或按 Control–空格切換）。</li>
		<li>若<b>選了法墨卻打不出字</b>：請<b>結束並重新開啟</b>你正在打字的 App（⌘Q 後重開）——安裝/更新前就開著的 App 需重新啟動才能接上新版法墨；或<b>登出再重新登入一次</b>。</li>
		<li>若<b>選單裡完全沒有法墨</b>：<b>登出再重新登入一次</b>通常即會出現；若仍沒有再開啟<b>系統設定 ▸ 鍵盤 ▸ 文字輸入 ▸ 編輯…</b>手動新增一次。</li>
	</ol>
</body>
</html>
