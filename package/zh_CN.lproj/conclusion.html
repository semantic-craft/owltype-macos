<!DOCTYPE html>
<html lang="zh-Hans-CN">
<head><meta charset="UTF-8"/></head>
<body>
	<p><b>安装完成。请按接下来的系统提示注销并重新登录一次</b>（仅首次安装需要；日后更新经 Sparkle 自动安装，无需注销）。</p>
	<p>系统若弹出「是否允许添加输入法『法墨 Famo』」，请点击<b>允许</b>。</p>
	<ol>
		<li>从屏幕右上角输入法菜单选择<b>法墨 Famo</b>（或按 Control–空格切换）。</li>
		<li>若<b>选中法墨后打不出字</b>：请<b>退出并重新打开</b>你正在打字的 App（⌘Q 后重开）——安装/更新前就开着的 App 需重启才能接上新版法墨；或<b>注销重新登录一次</b>。</li>
		<li>若<b>菜单里根本没有法墨</b>：<b>注销重新登录一次</b>通常即会出现；仍没有再打开<b>系统设置 ▸ 键盘 ▸ 文字输入 ▸ 编辑…</b>手动添加一次。</li>
	</ol>
</body>
</html>
