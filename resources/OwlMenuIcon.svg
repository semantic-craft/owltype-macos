<!-- Owltype menu icon: approved side-profile owl (prototype C).
     Transparent facial and wing cutouts support light and dark template rendering.
     Pure vector paths without <mask> avoid Cairo PDF /SMask bitmaps that CoreGraphics renders blank.
     The 22 x 16 pt canvas preserves the input-menu resource dimensions.
     Regenerate: rsvg-convert -f pdf -o resources/OwlMenuIcon.pdf resources/OwlMenuIcon.svg -->
