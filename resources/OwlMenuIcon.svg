<!-- Owltype menu icon: approved side-profile owl (prototype C).
     Transparent facial and wing cutouts support light and dark template rendering.
     The 22 x 16 pt canvas preserves the input-menu resource dimensions.
     Regenerate: rsvg-convert -f pdf -o resources/OwlMenuIcon.pdf resources/OwlMenuIcon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="22pt" height="16pt" viewBox="0 0 33 24">
  <defs>
    <mask id="owl-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="white"/>
      <ellipse cx="10" cy="8" rx="4" ry="4.5" fill="black"/>
      <circle cx="9" cy="8" r="1.7" fill="white"/>
      <path d="M13 14q0 4 5 6" fill="none" stroke="black" stroke-width="1.3"/>
    </mask>
  </defs>
  <g transform="translate(4.5 0)">
    <path d="M5 9C3 3 10 1 14 4C18 4 20 8 18 12C16 15 21 20 21 21C12 23 5 21 5 16L6 12 2 11Z"
          fill="black" mask="url(#owl-cutouts)"/>
  </g>
</svg>
