          d="M5 9C3 3 10 1 14 4C18 4 20 8 18 12C16 15 21 20 21 21C12 23 5 21 5 16L6 12 2 11Z
             M6 8A4 4.5 0 1 0 14 8A4 4.5 0 1 0 6 8Z
             M12.35 14C12.35 16.962 14.198 19.179 17.759 20.604L18.241 19.396C15.135 18.154 13.65 16.372 13.65 14Z"/>
    <circle cx="9" cy="8" r="1.7"/>
  </g>
</svg>
