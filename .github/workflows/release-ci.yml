name: release ci
on:
  push:
    tags:
      - '*'
    branches:
      - master
  workflow_dispatch:

# No `contents: write` — CI never creates releases. The rime-law-next root orchestrator owns the
# exact source/manifest/Draft Release composition and calls this repository's local packaging helper.

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.5'

      - name: Checkout last commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint

      - name: Build Squirrel
        run: ./action-build.sh archive

      - name: Install periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Check Unused Code
        # advisory only — dead-code findings must not block a release
        run: periphery scan --relative-results --skip-build --index-store-path build/Index.noindex/DataStore || true

      # CI does NOT publish a release. scripts/release.sh only builds/signs/notarizes/packages the
      # App-owned cohort; rime-law-next owns source/manifest/Draft Release composition.
      # Why: the CI build is unsigned (no Developer ID) AND has no famo-seed (CI checks out
      # this submodule alone, so famo-seed.sh's ../../packages/rime-law-config is absent and
      # `make famo-seed` is never run) → its pkg is Gatekeeper-rejected AND missing
      # rime-ice/法墨/wubi config (~14M shell). Publishing it here would clobber the locally-built
      # signed + seeded pkg (~63M) with a broken one. CI's job is build + lint validation only.
