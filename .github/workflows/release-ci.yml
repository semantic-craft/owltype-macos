name: release ci
on:
  push:
    tags:
      - '*'
    branches:
      - main
  workflow_dispatch:

# No `contents: write` — CI never creates releases. The maintainer's local release entrypoint
# (scripts/release.sh) owns the signed cohort; composition/publishing stays outside CI.

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.5'

      - name: Checkout last commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint

      - name: Build Squirrel
        run: ./action-build.sh archive

      - name: Install periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Check Unused Code
        # advisory only — dead-code findings must not block a release
        run: periphery scan --relative-results --skip-build --index-store-path build/Index.noindex/DataStore || true

      # CI does NOT publish a release. scripts/release.sh (run locally by the maintainer) builds,
      # signs, notarizes and packages the App cohort; composition/publishing stays outside CI.
      # Why: the CI build is unsigned (no Developer ID), so its pkg is Gatekeeper-rejected and
      # must never clobber the locally built signed + notarized cohort. CI's job is build + lint
      # validation only.
