name: source ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Check public-source boundary
        run: |
          bash scripts/check-public-source.sh
          bash scripts/check-public-privacy.selftest.sh

      - name: Check shell syntax
        run: bash -n action-install.sh scripts/*.sh

  release-gate:
    # The full product (cloud AI layer) requires Xcode 26+ (Swift main-actor
    # isolation defaults); macos-14's toolchain cannot compile it.
    runs-on: macos-26
    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.5'

      - name: Checkout audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Install secret scanners
        run: brew install gitleaks trufflehog

      - name: Bootstrap pinned dependencies
        run: make bootstrap

      - name: Generate pinned local seed
        run: make famo-seed

      - name: Run full release gate
        run: make release-gate DERIVED_DATA_PATH=build/release-gate
