[extend]
useDefault = true

# Sparkle 的 EdDSA 公钥（SUPublicEDKey）随 app 的 Info.plist 公开分发，是验签公钥而非机密。
# 路径与精确公钥值必须同时匹配；同一行夹带其他凭据时不会被豁免。
# docs/rename-owltype-plan.md 已删除，但仍在可达历史里，历史扫描需要这条路径。
[[allowlists]]
targetRules = ["generic-api-key"]
description = "The exact Owltype Sparkle EdDSA public keys are public by design"
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)(docs/rename-owltype-plan\.md|scripts/sparkle-key-transition\.(json|selftest\.py))$''']
regexes = [
  '''^3Ze0A\+sHbvkQ8CLlDUIcYvm7BJS4IJLU1rNEX66F9R4=$''',
  '''^dWrr6gck5aoy5F7V00SizqQM6w9MHmZzeeQFSqYTlfM=$'''
]
